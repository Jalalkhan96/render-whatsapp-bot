services:
  - type: web
    name: video-audio-downloader-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: API_KEY
        sync: false
      - key: DOWNLOAD_DIR
        value: /tmp/video-audio-downloader
      - key: MAX_DOWNLOAD_MB
        value: "150"
      - key: MAX_DURATION_SECONDS
        value: "3600"
      - key: MAX_ACTIVE_JOBS
        value: "1"
      - key: FILE_TTL_MINUTES
        value: "10"
      - key: SOCKET_TIMEOUT_SECONDS
        value: "15"
      - key: CORS_ORIGINS
        value: "*"
