<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎴 TikTok Profile Card Maker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0d0d12; color: #fff; font-family: 'Segoe UI', Arial, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  h1 span { color: #fe2c55; }
  p.sub { color: #888; font-size: .85rem; margin-bottom: 18px; }
  .wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  canvas { border-radius: 18px; box-shadow: 0 0 40px rgba(254,44,85,.25); max-width: 92vw; max-height: 80vh; }
  .panel { background: #16161d; border: 1px solid #2a2a35; border-radius: 16px; padding: 20px; width: 330px; }
  label { display: block; font-size: .8rem; color: #aaa; margin: 10px 0 5px; }
  input[type=text] { width: 100%; padding: 9px 12px; border-radius: 10px; border: 1px solid #333;
                     background: #0d0d12; color: #fff; font-size: .95rem; }
  input[type=text]:focus { outline: none; border-color: #fe2c55; }
  input[type=file] { font-size: .8rem; color: #aaa; }
  .row { display: flex; gap: 8px; } .row > div { flex: 1; }
  button { width: 100%; margin-top: 16px; padding: 13px; border: none; border-radius: 12px; cursor: pointer;
           font-size: 1rem; font-weight: 700; background: #fe2c55; color: #fff; }
  button:hover { filter: brightness(1.1); }
  .hint { font-size: .75rem; color: #666; margin-top: 12px; line-height: 1.5; }
  .fetch-btn { background: #25d366; color: #09110c; margin-top: 10px; }
  .download-btn { background: #fe2c55; }
  .status { min-height: 18px; margin-top: 8px; font-size: .78rem; color: #aaa; line-height: 1.4; }
  .status.error { color: #ff7f91; } .status.success { color: #6ee7a0; }
  .profile-row { padding: 12px; border: 1px solid #30303a; border-radius: 12px; background: #101015; margin-bottom: 12px; }
  .profile-row button { margin-top: 8px; }
  .profile-row .hint { margin-top: 8px; }
  .tiny { font-size: .7rem; color: #777; line-height: 1.4; margin-top: 5px; }
  @media (max-width: 600px) { body { padding: 14px 8px; } .panel { width: min(94vw, 420px); padding: 15px; } canvas { max-height: 65vh; } }
</style>
</head>
<body>
  <h1>🎴 TikTok <span>Profile Card</span> Maker</h1>
  <p class="sub">Details daalo → TikTok profile jaisa show card taiyaar!</p>
  <div class="wrap">
    <canvas id="c" width="1080" height="1350"></canvas>
    <div class="panel">
      <div class="profile-row">
        <label for="profile">TikTok username or profile URL</label>
        <input type="text" id="profile" placeholder="@username or https://www.tiktok.com/@username" maxlength="180">
        <button id="fetch-profile" class="fetch-btn" type="button">↻ Fetch profile with Apify</button>
        <div id="profile-status" class="status" aria-live="polite"></div>
        <p class="tiny">Fetches public account details. Keep APIFY_API_TOKEN in the local Node server's .env—never paste it here.</p>
      </div>
      <label>Profile picture</label>
      <input type="file" id="pfp" accept="image/*">
      <label>Display name</label>
      <input type="text" id="dname" value="KING EDITS" maxlength="30">
      <label>Username (bina @ ke)</label>
      <input type="text" id="uname" value="kingedits_real" maxlength="30">
      <div class="row">
        <div><label>Following</label><input type="text" id="following" value="2"></div>
        <div><label>Followers</label><input type="text" id="followers" value="2.9K"></div>
        <div><label>Likes</label><input type="text" id="likes" value="237.0K"></div>
      </div>
      <label>Bio</label>
      <input type="text" id="bio" value="The Real KING EDITS 👑" maxlength="60">
      <label>Videos count</label>
      <input type="text" id="videos" value="87">
      <button id="dl" class="download-btn">⬇ Download Card</button>
      <p class="hint">Default profile pic ke liye KING EDITS wali image use hogi (agar apni upload na karo to).</p>
    </div>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const W = cv.width, H = cv.height;
const pfpImg = new Image();
let pfpReady = false;
let verifiedProfile = false;

// default pfp = the KING EDITS profile pic we made earlier
pfpImg.onload = () => { pfpReady = true; draw(); };
pfpImg.src = 'default_pfp.jpg'; // optional: put a default pic with this name next to the html

$('pfp').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => { pfpImg.onload = () => { pfpReady = true; draw(); }; pfpImg.src = ev.target.result; };
  r.readAsDataURL(f);
});

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function centerText(txt, y, font, color) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(txt, W / 2, y);
}

function draw() {
  ctx.fillStyle = '#0a0a0c'; ctx.fillRect(0, 0, W, H);

  // header
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 34px Arial'; ctx.fillStyle = '#fff';
  ctx.fillText('TikTok', 40, 60);
  ctx.textAlign = 'right'; ctx.font = '400 24px Arial'; ctx.fillStyle = '#888';
  ctx.fillText('PROFILE', W - 40, 60);

  // profile pic (circle)
  const pr = 130, px = W / 2, py = 300;
  ctx.save();
  ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2); ctx.clip();
  if (pfpReady) {
    const s = Math.max(pr * 2 / pfpImg.width, pr * 2 / pfpImg.height);
    ctx.drawImage(pfpImg, px - pfpImg.width * s / 2, py - pfpImg.height * s / 2,
                  pfpImg.width * s, pfpImg.height * s);
  } else {
    ctx.fillStyle = '#222'; ctx.fillRect(px - pr, py - pr, pr * 2, pr * 2);
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(px, py, pr, 0, Math.PI * 2);
  ctx.strokeStyle = '#2a2a30'; ctx.lineWidth = 6; ctx.stroke();

  // name + username
  centerText(($('dname').value || '') + (verifiedProfile ? ' ✓' : ''), 480, '700 40px Arial', '#fff');
  centerText('@' + ($('uname').value || ''), 525, '400 28px Arial', '#999');

  // stats
  const stats = [
    [$('following').value || '0', 'Following'],
    [$('followers').value || '0', 'Followers'],
    [$('likes').value || '0', 'Likes'],
  ];
  const sx = [W * 0.22, W * 0.5, W * 0.78];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  stats.forEach(([n, l], i) => {
    ctx.font = '700 44px Arial'; ctx.fillStyle = '#fff';
    ctx.fillText(n, sx[i], 620);
    ctx.font = '400 26px Arial'; ctx.fillStyle = '#888';
    ctx.fillText(l, sx[i], 664);
  });

  // buttons
  const bw = 300, bh = 74, by = 730;
  const bx1 = W / 2 - bw - 12, bx2 = W / 2 + 12;
  ctx.fillStyle = '#fe2c55'; rr(bx1, by, bw, bh, 14); ctx.fill();
  ctx.font = '700 30px Arial'; ctx.fillStyle = '#fff';
  ctx.fillText('Follow', bx1 + bw / 2, by + bh / 2);
  ctx.fillStyle = '#1c1c20'; rr(bx2, by, bw, bh, 14); ctx.fill();
  ctx.strokeStyle = '#3a3a42'; ctx.lineWidth = 2; rr(bx2, by, bw, bh, 14); ctx.stroke();
  ctx.fillStyle = '#ddd';
  ctx.fillText('Message', bx2 + bw / 2, by + bh / 2);

  // bio
  centerText($('bio').value || '', 880, '400 30px Arial', '#ddd');
  centerText('Public account', 925, '400 26px Arial', '#777');

  // divider
  ctx.strokeStyle = '#222228'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40, 980); ctx.lineTo(W - 40, 980); ctx.stroke();

  // tabs
  const tabs = ['Posts', 'Reposts', 'Liked'];
  const tx = [W * 0.2, W * 0.5, W * 0.8];
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  tabs.forEach((t, i) => {
    ctx.font = (i === 0 ? '700' : '400') + ' 30px Arial';
    ctx.fillStyle = i === 0 ? '#fff' : '#777';
    ctx.fillText(t, tx[i], 1030);
  });
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(tx[0] - 90, 1062); ctx.lineTo(tx[0] + 90, 1062); ctx.stroke();

  // videos box
  ctx.fillStyle = '#141417'; rr(40, 1100, W - 80, 130, 16); ctx.fill();
  centerText(($('videos').value || '0') + ' videos', 1152, '700 34px Arial', '#fff');
  centerText('Public video count', 1192, '400 24px Arial', '#777');

  ctx.textAlign = 'center'; ctx.font = '400 22px Arial'; ctx.fillStyle = '#555';
  ctx.fillText('TikTok Profile', W / 2, H - 40);
}

['dname','uname','following','followers','likes','bio','videos'].forEach(id =>
  $(id).addEventListener('input', draw));

function displayCount(value) {
  if (value === null || value === undefined || value === '') return '0';
  const n = Number(value);
  if (!Number.isFinite(n)) return String(value);
  return new Intl.NumberFormat('en', { notation: 'compact', maximumFractionDigits: 1 }).format(n);
}

function setProfileStatus(message, state = '') {
  const el = $('profile-status');
  el.textContent = message;
  el.className = 'status' + (state ? ` ${state}` : '');
}

$('fetch-profile').addEventListener('click', async () => {
  const input = $('profile').value.trim();
  if (!input) {
    setProfileStatus('Enter a TikTok username or profile URL first.', 'error');
    return;
  }
  const button = $('fetch-profile');
  button.disabled = true;
  button.textContent = 'Fetching profile…';
  setProfileStatus('Contacting Apify and reading public account data…');
  try {
    const response = await fetch('/api/tiktok-profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: input }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);

    $('dname').value = String(data.displayName || data.username || '').slice(0, 30);
    $('uname').value = String(data.username || '').replace(/^@/, '').slice(0, 30);
    $('following').value = displayCount(data.following);
    $('followers').value = displayCount(data.followers);
    $('likes').value = displayCount(data.likes);
    $('videos').value = displayCount(data.videos);
    $('bio').value = String(data.bio || '').replace(/[\r\n]+/g, ' ').slice(0, 60);
    verifiedProfile = Boolean(data.verified);

    if (data.avatarUrl) {
      pfpImg.onload = () => { pfpReady = true; draw(); };
      pfpImg.onerror = () => { setProfileStatus('Profile details loaded, but the avatar could not be fetched. Upload a picture manually.', 'error'); };
      pfpImg.src = '/api/avatar?url=' + encodeURIComponent(data.avatarUrl);
    }
    draw();
    if (!data.avatarUrl) setProfileStatus('Profile data loaded. No profile photo was provided by the source.', 'success');
    else setProfileStatus(`Loaded @${data.username}${data.verified ? ' ✓' : ''} — review details before downloading.`, 'success');
  } catch (error) {
    setProfileStatus(error.message || 'Profile lookup failed.', 'error');
  } finally {
    button.disabled = false;
    button.textContent = '↻ Fetch profile with Apify';
  }
});

$('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = ($('uname').value || 'tiktok') + '-profile-card.png';
  a.href = cv.toDataURL('image/png');
  a.click();
};

draw();
</script>
</body>
</html>
