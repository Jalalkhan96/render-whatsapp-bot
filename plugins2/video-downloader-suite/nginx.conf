# Minimal reverse proxy for the downloader API.
# Used only with: docker compose --profile proxy up --build
events {}

http {
    upstream api {
        server api:8000;
    }

    server {
        listen 80;

        # generous body size for cookie-file uploads via the admin API
        client_max_body_size 5m;

        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # SSE needs unbuffered, long-lived connections
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            chunked_transfer_encoding on;
        }
    }
}
