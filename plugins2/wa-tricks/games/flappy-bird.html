<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐤 Flappy Bird</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#07101d; color:#edf3ff; font-family:'Segoe UI',Inter,sans-serif; padding:8px; }
  .card { width:100%; max-width:760px; margin:0 auto; background:linear-gradient(160deg,#111d31,#0a1321 72%); border:1px solid #243754; border-radius:24px; padding:12px; box-shadow:0 18px 50px rgba(0,0,0,.42); overflow:hidden; }
  .header { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 4px 12px; }
  .title { border:1px solid #205237; color:#bff8d2; background:#0f281d; border-radius:14px; padding:10px 14px; font-weight:900; letter-spacing:1px; font-size:17px; }
  .sound-btn { background:#17253a; border:1px solid #2b4264; color:#eef4ff; border-radius:13px; width:46px; height:46px; font-size:20px; cursor:pointer; }
  .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .stat { background:#0c1a2d; border:1px solid #1f3653; border-radius:14px; padding:9px; text-align:center; }
  .stat small { color:#7d91b1; font-size:9px; font-weight:900; letter-spacing:1.1px; display:block; }
  .stat b { color:#7af0a8; font-size:20px; display:block; margin-top:2px; }
  .wrap { position:relative; border-radius:16px; overflow:hidden; }
  canvas { width:100%; height:auto; border-radius:16px; background:linear-gradient(#0e1a3a,#0d1428); display:block; touch-action:none; border:1px solid #263e60; }
  .flap-btn { width:100%; min-height:52px; margin-top:10px; background:linear-gradient(180deg,#42e787,#24bb5d); border:none; border-radius:14px; padding:13px; font-size:16px; font-weight:900; color:#062a14; cursor:pointer; letter-spacing:.7px; }
  .flap-btn:active { transform:scale(.985); }
  .overlay { position:absolute; inset:0; z-index:20; pointer-events:auto; display:flex; flex-direction:column; gap:11px; justify-content:center; align-items:center; background:rgba(4,9,18,.80); border-radius:16px; padding:18px; }
  .hidden { display:none !important; }
  .over-title { color:#2ecc71; font-size:32px; font-weight:900; letter-spacing:2px; }
  .over-score { color:#aab4cc; font-size:18px; }
  .again-btn { background:linear-gradient(180deg,#3fe07f,#25b85c); border:none; border-radius:14px;
               padding:14px 34px; font-size:18px; font-weight:800; color:#062a14; cursor:pointer; }
  .hint { text-align:center; color:#8a93a8; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">🐤 FLAPPY BIRD</div>
    <button type="button" class="sound-btn" id="soundBtn">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div class="overlay hidden" id="over">
      <div class="over-title">GAME OVER</div>
      <div class="over-score">Score: <span id="finalScore">0</span></div>
      <button type="button" class="again-btn" id="againBtn">PLAY AGAIN</button>
    </div>
    <div class="overlay" id="start">
      <div class="over-title" style="font-size:24px">🐤 READY?</div>
      <button type="button" class="again-btn" id="startBtn">TAP TO START</button>
    </div>
  </div>
  <button type="button" class="flap-btn" id="flapBtn">TAP / FLAP (SPACE) 🐤</button>
  <div class="hint">Tap karo — pipes ke beech se guzro!</div>
</div>

<script>
(function(){
  "use strict";
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;

  // ---------- Sound ----------
  let audioCtx=null, soundOn=true;
  function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function beep(f0,f1,dur,type){
    if(!soundOn) return;
    try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f0,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),c.currentTime+dur);
      g.gain.setValueAtTime(0.18,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  const sfx={ flap:()=>beep(400,800,0.1,'sine'), score:()=>beep(950,1400,0.12,'sine'),
              die:()=>beep(200,50,0.4,'sawtooth') };
  document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; };

  // ---------- Player PFP (bot {{PFP}} ko player ki photo se replace karta hai) ----------
  const PLAYER_PFP = "{{PFP}}";
  const pfpImg = new Image();
  const hasPfp = PLAYER_PFP && PLAYER_PFP.indexOf("{{") !== 0;
  if (hasPfp) pfpImg.src = PLAYER_PFP;
  function pfpReady(){ return hasPfp && pfpImg.complete && pfpImg.naturalWidth > 0; }

  // ---------- WhatsApp WebView tap compatibility ----------
  function bindTap(el, fn){
    if(!el) return;
    let last = 0;
    const run = function(e){
      if(e){ try{e.preventDefault();}catch(_){ } try{e.stopPropagation();}catch(_){ } }
      const now = Date.now();
      if(now - last < 220) return;
      last = now;
      try{ fn(e); }catch(err){ console.error(err); }
    };
    el.onclick = run;
    el.onpointerup = run;
    el.ontouchend = run;
    el.onmouseup = run;
  };

  // ---------- Safe browser storage ----------
  // WhatsApp's embedded HTML renderer may expose an opaque/isolated origin
  // where localStorage access throws. Never let that crash the game script.
  function storageGet(key, fallback='0'){
    try{
      const value=window.localStorage.getItem(key);
      return value == null ? fallback : value;
    }catch(_){ return fallback; }
  }
  function storageSet(key, value){
    try{ window.localStorage.setItem(key, String(value)); }catch(_){ }
  }

  // ---------- State ----------
  let state='ready', score=0, best=+(storageGet('flappyBest')||0);
  const bird={ x:110, y:H/2, vy:0, r:14 };
  let pipes=[], frame=0;
  const GAP=130, PW=56, SPEED=2.6;
  document.getElementById('best').textContent=best;

  function reset(){ score=0; bird.y=H/2; bird.vy=0; pipes=[]; frame=0;
    document.getElementById('score').textContent='0';
    document.getElementById('over').classList.add('hidden'); }
  function start(){ reset(); state='play';
    document.getElementById('start').classList.add('hidden');
    try{ ac().resume(); }catch(e){} }
  function flap(){
    if(state==='ready'){ start(); return; }
    if(state!=='play') return;
    bird.vy=-7.2; sfx.flap();
  }
  function gameOver(){
    state='over'; sfx.die();
    if(score>best){ best=score; storageSet('flappyBest', best);
      document.getElementById('best').textContent=best; }
    document.getElementById('finalScore').textContent=score;
    document.getElementById('over').classList.remove('hidden');
  }

  function drawBird(){
    const b=bird;
    ctx.fillStyle='#ffd23f';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.fill();          // body
    if (pfpReady()){ // 🎭 player ki PFP bird par!
      ctx.save();
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,7); ctx.clip();
      ctx.drawImage(pfpImg, b.x-b.r, b.y-b.r, b.r*2, b.r*2);
      ctx.restore();
    }
    ctx.fillStyle='#ff9f1c';
    ctx.beginPath(); ctx.arc(b.x-4,b.y+2,7,0,7); ctx.fill();        // wing
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(b.x+6,b.y-4,5,0,7); ctx.fill(); // eye white
    ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(b.x+8,b.y-4,2.5,0,7); ctx.fill(); // pupil
    ctx.fillStyle='#ff6b35';
    ctx.beginPath(); ctx.moveTo(b.x+12,b.y); ctx.lineTo(b.x+20,b.y+3); ctx.lineTo(b.x+12,b.y+6); ctx.fill(); // beak
  }
  function drawPipe(p){
    ctx.fillStyle='#2ecc71';
    ctx.fillRect(p.x,0,PW,p.top); ctx.fillRect(p.x,p.top+GAP,PW,H-p.top-GAP);
    ctx.fillStyle='#27ae60';
    ctx.fillRect(p.x-3,p.top-22,PW+6,22); ctx.fillRect(p.x-3,p.top+GAP,PW+6,22);
  }

  let last=0;
  function loop(t){
    requestAnimationFrame(loop);
    const dt=Math.min((t-last)/16.7,3); last=t; frame++;
    ctx.clearRect(0,0,W,H);
    // stars
    ctx.fillStyle='rgba(255,255,255,.25)';
    for(let i=0;i<20;i++){ const sx=(i*97+frame*0.3)%W; ctx.fillRect(sx,(i*53)%H,2,2); }

    if(state==='play'){
      bird.vy+=0.45*dt; bird.y+=bird.vy*dt;
      if(frame%95===0){ const top=60+Math.random()*(H-GAP-140);
        pipes.push({x:W+10,top:top,passed:false}); }
      for(let i=pipes.length-1;i>=0;i--){
        const p=pipes[i]; p.x-=SPEED*dt;
        if(p.x+PW<-10){ pipes.splice(i,1); continue; }
        if(!p.passed && p.x+PW<bird.x-bird.r){ p.passed=true; score++; sfx.score();
          document.getElementById('score').textContent=score; }
        if(bird.x+bird.r>p.x+4 && bird.x-bird.r<p.x+PW-4 &&
           (bird.y-bird.r<p.top || bird.y+bird.r>p.top+GAP)) gameOver();
      }
      if(bird.y+bird.r>=H || bird.y-bird.r<=0) gameOver();
    }
    pipes.forEach(drawPipe); drawBird();
    if(state==='ready'){ ctx.fillStyle='#8a93a8'; ctx.font='14px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Tap FLAP to start!', W/2, H/2+60); }
  }

  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const flapBtn = document.getElementById('flapBtn');

  bindTap(startBtn, start);
  bindTap(againBtn, ()=>{ reset(); state='play'; document.getElementById('start').classList.add('hidden'); });
  bindTap(flapBtn, flap);
  bindTap(canvas, flap);

  document.addEventListener('keydown',e=>{
    if(e.code==='Space' || e.key==='ArrowUp'){ e.preventDefault(); flap(); }
  });

  // Watchdog fallback for WhatsApp containers that render HTML but suppress a
  // button's first pointer event. Normal tap still starts immediately.
  setTimeout(()=>{
    if(state==='ready') start();
  }, 2500);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
