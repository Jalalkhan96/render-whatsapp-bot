<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐍 Cyber Snake</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#07101d; color:#edf3ff; font-family:'Segoe UI',Inter,sans-serif; padding:8px; }
  .card { width:100%; max-width:760px; margin:0 auto; background:linear-gradient(160deg,#111d31,#0a1321 72%); border:1px solid #243754; border-radius:24px; padding:12px; box-shadow:0 18px 50px rgba(0,0,0,.42); overflow:hidden; }
  .header { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 4px 12px; }
  .title { border:1px solid #4d2b64; color:#e5c7f6; background:#21142b; border-radius:14px; padding:10px 14px; font-weight:900; letter-spacing:1px; font-size:17px; }
  .sound-btn { background:#17253a; border:1px solid #2b4264; color:#eef4ff; border-radius:13px; width:46px; height:46px; font-size:20px; cursor:pointer; }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .stat { background:#0c1a2d; border:1px solid #1f3653; border-radius:14px; padding:9px; text-align:center; }
  .stat small { color:#7d91b1; font-size:9px; font-weight:900; letter-spacing:1.1px; display:block; }
  .stat b { color:#d2a2ee; font-size:20px; display:block; margin-top:2px; }
  .wrap { position:relative; border-radius:16px; overflow:hidden; }
  canvas { width:100%; height:auto; border-radius:16px; background:#0d1428; display:block; touch-action:none; border:1px solid #263e60; }
  .pad { display:grid; grid-template-columns:repeat(3,minmax(58px,72px)); grid-template-rows:repeat(3,56px); gap:7px; justify-content:center; margin-top:10px; }
  .pad button { touch-action:manipulation; -webkit-user-select:none; user-select:none; background:#14243a; border:1px solid #2b4264; color:#eef4ff; border-radius:13px; font-size:22px; cursor:pointer; min-height:48px; }
  .pad button:active { background:#7652a7; transform:scale(.97); }
  .pad .up{grid-column:2;grid-row:1;} .pad .left{grid-column:1;grid-row:2;}
  .pad .right{grid-column:3;grid-row:2;} .pad .down{grid-column:2;grid-row:3;}
  .overlay { position:absolute; inset:0; z-index:20; pointer-events:auto; display:flex; flex-direction:column; gap:10px;
             justify-content:center; align-items:center; background:rgba(10,14,28,.82); border-radius:14px; }
  .hidden { display:none !important; }
  .over-title { color:#9b59b6; font-size:32px; font-weight:900; letter-spacing:2px; }
  .over-score { color:#aab4cc; font-size:18px; }
  .again-btn { background:linear-gradient(180deg,#b678d8,#8e44ad); border:none; border-radius:14px;
               padding:14px 34px; font-size:18px; font-weight:800; color:#fff; cursor:pointer; }
  .hint { text-align:center; color:#8a93a8; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">🐍 CYBER SNAKE</div>
    <button type="button" class="sound-btn" id="soundBtn">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>LENGTH</small><b id="len">3</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="520" height="520"></canvas>
    <div class="overlay hidden" id="over">
      <div class="over-title">GAME OVER</div>
      <div class="over-score">Score: <span id="finalScore">0</span></div>
      <button type="button" class="again-btn" id="againBtn">PLAY AGAIN</button>
    </div>
    <div class="overlay" id="start">
      <div class="over-title" style="font-size:24px">🐍 READY?</div>
      <button type="button" class="again-btn" id="startBtn">TAP TO START</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-d="up">▲</button>
    <button class="left" data-d="left">◀</button>
    <button class="right" data-d="right">▶</button>
    <button class="down" data-d="down">▼</button>
  </div>
  <div class="hint">D-pad, arrow keys ya swipe — khana khao, bade bano!</div>
</div>

<script>
(function(){
  "use strict";
  const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
  const N=20, CELL=canvas.width/N;

  // ---------- Sound ----------
  let audioCtx=null, soundOn=true;
  function ac(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function beep(f0,f1,dur,type){
    if(!soundOn) return;
    try{ const c=ac(),o=c.createOscillator(),g=c.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f0,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),c.currentTime+dur);
      g.gain.setValueAtTime(0.18,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  const sfx={ eat:()=>beep(600,1100,0.1,'sine'), die:()=>beep(180,40,0.4,'sawtooth') };
  document.getElementById('soundBtn').onclick=function(){ soundOn=!soundOn; this.textContent=soundOn?'🔊':'🔇'; };

  // ---------- Player PFP (bot {{PFP}} ko player ki photo se replace karta hai) ----------
  const PLAYER_PFP = "{{PFP}}";
  const pfpImg = new Image();
  const hasPfp = PLAYER_PFP && PLAYER_PFP.indexOf("{{") !== 0;
  if (hasPfp) pfpImg.src = PLAYER_PFP;
  function pfpReady(){ return hasPfp && pfpImg.complete && pfpImg.naturalWidth > 0; }

  // ---------- WhatsApp WebView tap compatibility ----------
  function bindTap(el, fn){
    if(!el) return;
    let last = 0;
    const run = function(e){
      if(e){ try{e.preventDefault();}catch(_){ } try{e.stopPropagation();}catch(_){ } }
      const now = Date.now();
      if(now - last < 220) return;
      last = now;
      try{ fn(e); }catch(err){ console.error(err); }
    };
    el.onclick = run;
    el.onpointerup = run;
    el.ontouchend = run;
    el.onmouseup = run;
  };

  // ---------- Safe browser storage ----------
  // WhatsApp's embedded HTML renderer may expose an opaque/isolated origin
  // where localStorage access throws. Never let that crash the game script.
  function storageGet(key, fallback='0'){
    try{
      const value=window.localStorage.getItem(key);
      return value == null ? fallback : value;
    }catch(_){ return fallback; }
  }
  function storageSet(key, value){
    try{ window.localStorage.setItem(key, String(value)); }catch(_){ }
  }

  // ---------- State ----------
  let state='ready', snake, dir, nextDir, food, score, best=+(storageGet('snakeBest')||0), tickMs;
  document.getElementById('best').textContent=best;

  function reset(){
    snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir={x:1,y:0}; nextDir=dir; score=0; tickMs=140;
    placeFood();
    document.getElementById('score').textContent='0';
    document.getElementById('len').textContent='3';
    document.getElementById('over').classList.add('hidden');
  }
  function placeFood(){
    while(true){ const f={x:Math.floor(Math.random()*N), y:Math.floor(Math.random()*N)};
      if(!snake.some(s=>s.x===f.x&&s.y===f.y)){ food=f; break; } }
  }
  function start(){ reset(); state='play';
    document.getElementById('start').classList.add('hidden');
    try{ ac().resume(); }catch(e){} step(); }
  function gameOver(){
    state='over'; sfx.die();
    if(score>best){ best=score; storageSet('snakeBest', best);
      document.getElementById('best').textContent=best; }
    document.getElementById('finalScore').textContent=score;
    document.getElementById('over').classList.remove('hidden');
  }

  function step(){
    if(state!=='play') return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N || snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver(); draw(); return; }
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){
      score+=10; sfx.eat(); placeFood();
      tickMs=Math.max(70, tickMs-3);
      document.getElementById('score').textContent=score;
      document.getElementById('len').textContent=snake.length;
    } else snake.pop();
    draw();
    setTimeout(step, tickMs);
  }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle='#1c2740';
    for(let i=1;i<N;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke(); }
    // food
    ctx.fillStyle='#e74c3c';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.38, 0, 7); ctx.fill();
    ctx.fillStyle='#ff8a7a';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2-3, food.y*CELL+CELL/2-3, CELL*0.12, 0, 7); ctx.fill();
    // snake
    snake.forEach((s,i)=>{
      const t=i/snake.length;
      ctx.fillStyle=i===0 ? '#b678d8' : 'rgb('+(120+Math.floor(40*(1-t)))+','+(60+Math.floor(30*(1-t)))+',170)';
      const p=2;
      if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(s.x*CELL+p, s.y*CELL+p, CELL-2*p, CELL-2*p, 6); ctx.fill(); }
      else ctx.fillRect(s.x*CELL+p, s.y*CELL+p, CELL-2*p, CELL-2*p);
    });
    // 🎭 player ki PFP snake ke sar par!
    const h=snake[0];
    if (pfpReady()){
      ctx.save();
      ctx.beginPath(); ctx.arc(h.x*CELL+CELL/2, h.y*CELL+CELL/2, CELL*0.40, 0, 7); ctx.clip();
      ctx.drawImage(pfpImg, h.x*CELL+CELL*0.1, h.y*CELL+CELL*0.1, CELL*0.8, CELL*0.8);
      ctx.restore();
    }
    // eyes
    ctx.fillStyle='#0d1321';
    ctx.fillRect(h.x*CELL+CELL*0.25, h.y*CELL+CELL*0.25, 4, 4);
    ctx.fillRect(h.x*CELL+CELL*0.6, h.y*CELL+CELL*0.25, 4, 4);
  }

  function setDir(d){
    if(state==='ready'){ start(); }
    if(state!=='play') return;
    const D={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[d];
    if(D.x!==-dir.x || D.y!==-dir.y) nextDir=D;
  }

  // D-pad — use click/up/end compatibility instead of pointerdown only.
  document.querySelectorAll('.pad button').forEach(b=>{
    bindTap(b, ()=>setDir(b.dataset.d));
  });
  // keyboard
  document.addEventListener('keydown',e=>{
    const m={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];
    if(m){ e.preventDefault(); setDir(m); }
  });
  // swipe + tap fallback on the canvas
  let sx=0, sy=0;
  function beginGesture(e){
    try{ if(e.touches && e.touches[0]){ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }
      else { sx=e.clientX; sy=e.clientY; } }catch(_){ sx=0; sy=0; }
  }
  function endGesture(e){
    let ex=sx, ey=sy;
    try{ if(e.changedTouches && e.changedTouches[0]){ ex=e.changedTouches[0].clientX; ey=e.changedTouches[0].clientY; }
      else { ex=e.clientX; ey=e.clientY; } }catch(_){ }
    const dx=ex-sx, dy=ey-sy;
    if(Math.abs(dx)<20 && Math.abs(dy)<20){ if(state==='ready') start(); return; }
    setDir(Math.abs(dx)>Math.abs(dy) ? (dx>0?'right':'left') : (dy>0?'down':'up'));
  }
  canvas.onpointerdown=beginGesture;
  canvas.ontouchstart=beginGesture;
  canvas.onpointerup=endGesture;
  canvas.ontouchend=endGesture;

  const startBtn=document.getElementById('startBtn');
  const againBtn=document.getElementById('againBtn');
  bindTap(startBtn,start);
  bindTap(againBtn,()=>{ reset(); state='play'; step(); document.getElementById('start').classList.add('hidden'); });

  // Watchdog fallback so a WhatsApp client that drops the first button event
  // cannot leave Snake permanently stuck on the READY screen.
  setTimeout(()=>{ if(state==='ready') start(); },2500);

  reset(); draw();
})();
</script>
</body>
</html>
