<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦖 Dino Runner</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:#07101d; color:#edf3ff; font-family:'Segoe UI',Inter,sans-serif; padding:8px; }
  .card { width:100%; max-width:760px; margin:0 auto; background:linear-gradient(160deg,#111d31,#0a1321 72%);
          border:1px solid #243754; border-radius:24px; padding:12px; box-shadow:0 18px 50px rgba(0,0,0,.42); overflow:hidden; }
  .header { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:4px 4px 12px; }
  .title { border:1px solid #624b19; color:#ffe6a8; background:#251e10; border-radius:14px;
           padding:10px 14px; font-weight:900; letter-spacing:1px; font-size:17px; }
  .sound-btn { background:#17253a; border:1px solid #2b4264; color:#eef4ff; border-radius:13px;
               width:46px; height:46px; font-size:20px; cursor:pointer; }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:10px; }
  .stat { background:#0c1a2d; border:1px solid #1f3653; border-radius:14px; padding:9px; text-align:center; }
  .stat small { color:#7d91b1; font-size:9px; font-weight:900; letter-spacing:1.1px; display:block; }
  .stat b { color:#ffd36a; font-size:20px; display:block; margin-top:2px; }
  canvas { width:100%; height:auto; border-radius:16px; background:#0b1527; display:block; touch-action:none; border:1px solid #263e60; }
  .jump-btn { width:100%; min-height:52px; margin-top:10px; background:linear-gradient(180deg,#ffbf3a,#f2910a);
              border:none; border-radius:14px; padding:13px; font-size:16px; font-weight:900;
              color:#2b1a00; cursor:pointer; letter-spacing:.7px; }
  .jump-btn:active { transform:scale(.985); }
  .overlay { position:absolute; inset:0; z-index:20; pointer-events:auto; display:flex; flex-direction:column; gap:11px;
             justify-content:center; align-items:center; background:rgba(4,9,18,.80);
             border-radius:16px; padding:18px; }
  .wrap { position:relative; border-radius:16px; overflow:hidden; }
  .hidden { display:none !important; }
  .over-title { color:#f5a623; font-size:34px; font-weight:900; letter-spacing:2px; }
  .over-score { color:#aab4cc; font-size:18px; }
  .again-btn { background:linear-gradient(180deg,#ffb020,#f58e06); border:none; border-radius:14px;
               padding:14px 34px; font-size:18px; font-weight:800; color:#3a2200; cursor:pointer; }
  .hint { text-align:center; color:#8a93a8; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="title">🦖 DINO RUNNER</div>
    <button type="button" class="sound-btn" id="soundBtn">🔊</button>
  </div>
  <div class="stats">
    <div class="stat"><small>SCORE</small><b id="score">0</b></div>
    <div class="stat"><small>SPEED</small><b id="speed">1x</b></div>
    <div class="stat"><small>BEST</small><b id="best">0</b></div>
  </div>
  <div class="wrap">
    <canvas id="game" width="720" height="400"></canvas>
    <div class="overlay hidden" id="over">
      <div class="over-title">GAME OVER</div>
      <div class="over-score">Score: <span id="finalScore">0</span></div>
      <button type="button" class="again-btn" id="againBtn">PLAY AGAIN</button>
    </div>
    <div class="overlay" id="start">
      <div class="over-title" style="font-size:24px">🦖 READY?</div>
      <button type="button" class="again-btn" id="startBtn">TAP TO START</button>
    </div>
  </div>
  <button type="button" class="jump-btn" id="jumpBtn">JUMP / TAP (SPACE) 🦖</button>
  <div class="hint">Tap screen, button ya SPACE dabao — cactus se bacho!</div>
</div>

<script>
(function(){
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GROUND = H - 46;

  // ---------- Sound (WebAudio, koi file nahi chahiye) ----------
  let audioCtx = null, soundOn = true;
  function ac(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
  function beep(f0, f1, dur, type){
    if(!soundOn) return;
    try{
      const c = ac(), o = c.createOscillator(), g = c.createGain();
      o.type = type||'square'; o.frequency.setValueAtTime(f0, c.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(f1,1), c.currentTime+dur);
      g.gain.setValueAtTime(0.18, c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+dur);
      o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
    }catch(e){}
  }
  const sfx = {
    jump:  () => beep(320, 720, 0.14, 'square'),
    point: () => beep(880, 880, 0.07, 'sine'),
    die:   () => beep(220, 55, 0.35, 'sawtooth'),
  };
  document.getElementById('soundBtn').onclick = function(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    soundOn = !soundOn; this.textContent = soundOn ? '🔊' : '🔇';
  };

  // ---------- Player PFP (bot {{PFP}} ko player ki photo se replace karta hai) ----------
  const PLAYER_PFP = "{{PFP}}";
  const pfpImg = new Image();
  const hasPfp = PLAYER_PFP && PLAYER_PFP.indexOf("{{") !== 0;
  if (hasPfp) pfpImg.src = PLAYER_PFP;
  function pfpReady(){ return hasPfp && pfpImg.complete && pfpImg.naturalWidth > 0; }

  // ---------- WhatsApp WebView tap compatibility ----------
  function bindTap(el, fn){
    if(!el) return;
    let last = 0;
    const run = function(e){
      if(e){ try{e.preventDefault();}catch(_){ } try{e.stopPropagation();}catch(_){ } }
      const now = Date.now();
      if(now - last < 220) return;
      last = now;
      try{ fn(e); }catch(err){ console.error(err); }
    };
    el.onclick = run;
    el.onpointerup = run;
    el.ontouchend = run;
    el.onmouseup = run;
  }

  // ---------- Safe browser storage ----------
  // WhatsApp's embedded HTML renderer may expose an opaque/isolated origin
  // where localStorage access throws. Never let that crash the game script.
  function storageGet(key, fallback='0'){
    try{
      const value=window.localStorage.getItem(key);
      return value == null ? fallback : value;
    }catch(_){ return fallback; }
  }
  function storageSet(key, value){
    try{ window.localStorage.setItem(key, String(value)); }catch(_){ }
  }

  // ---------- State ----------
  let state = 'ready'; // ready | play | over
  let score = 0, best = +(storageGet('dinoBest')||0);
  let speed = 5, frame = 0, nextMilestone = 100;
  const dino = { x:70, y:GROUND, vy:0, w:34, h:44, air:false };
  let obstacles = [], clouds = [], spawnIn = 0;
  document.getElementById('best').textContent = best;
  for(let i=0;i<3;i++) clouds.push({ x:Math.random()*W, y:20+Math.random()*70, s:0.6+Math.random()*0.8 });

  function reset(){
    score=0; speed=5; frame=0; nextMilestone=100;
    dino.y=GROUND; dino.vy=0; dino.air=false;
    obstacles=[]; spawnIn=50;
    document.getElementById('score').textContent='0';
    document.getElementById('speed').textContent='1x';
    document.getElementById('over').classList.add('hidden');
  }

  function jump(){
    if(state==='ready'){ start(); return; }
    if(state==='over') return;
    if(!dino.air){ dino.vy=-13.5; dino.air=true; sfx.jump(); }
  }

  function start(){
    reset(); state='play';
    document.getElementById('start').classList.add('hidden');
    if(audioCtx===null){ try{ ac().resume(); }catch(e){} }
  }

  function gameOver(){
    state='over'; sfx.die();
    if(score>best){ best=Math.floor(score); storageSet('dinoBest', best);
      document.getElementById('best').textContent=best; }
    document.getElementById('finalScore').textContent=Math.floor(score);
    document.getElementById('over').classList.remove('hidden');
  }

  // ---------- Drawing ----------
  function drawDino(x, y, leg){ // y = feet
    const s=1.15; ctx.fillStyle='#f5a623';
    ctx.fillRect(x, y-30*s, 24*s, 18*s);          // body
    ctx.fillRect(x+17*s, y-44*s, 15*s, 16*s);     // head
    ctx.fillRect(x+30*s, y-37*s, 7*s, 9*s);       // snout
    ctx.fillRect(x-9*s, y-28*s, 11*s, 9*s);       // tail
    ctx.fillRect(x+20*s, y-26*s, 5*s, 7*s);       // arm
    ctx.fillStyle='#0d1321';
    ctx.fillRect(x+26*s, y-39*s, 3.5*s, 5*s);     // eye
    if (pfpReady()){ // 🎭 player ki PFP dino ke chehre par!
      ctx.save();
      ctx.beginPath(); ctx.arc(x+24*s, y-36*s, 8.5*s, 0, 7); ctx.clip();
      ctx.drawImage(pfpImg, x+24*s-8.5*s, y-36*s-8.5*s, 17*s, 17*s);
      ctx.restore();
    }
    ctx.fillStyle='#f5a623';
    if(!dino.air){ // running legs
      if(leg){ ctx.fillRect(x+4*s, y-12*s, 6*s, 12*s); ctx.fillRect(x+14*s, y-12*s, 6*s, 8*s); }
      else   { ctx.fillRect(x+4*s, y-12*s, 6*s, 8*s);  ctx.fillRect(x+14*s, y-12*s, 6*s, 12*s); }
    } else { ctx.fillRect(x+6*s, y-12*s, 6*s, 8*s); ctx.fillRect(x+15*s, y-12*s, 6*s, 8*s); }
  }

  function drawCactus(x, y, w, h){
    ctx.fillStyle='#2ecc71';
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x, y-h, w, h, 5); else ctx.rect(x, y-h, w, h);
    ctx.fill();
    ctx.fillRect(x-8, y-h+8, 8, 6);   // left arm
    ctx.fillRect(x-8, y-h+2, 5, 12);
    ctx.fillRect(x+w, y-h+16, 8, 6);  // right arm
    ctx.fillRect(x+w+3, y-h+8, 5, 14);
  }

  function drawCloud(c){
    ctx.fillStyle='rgba(140,155,190,.35)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 16*c.s, 0, 7); ctx.arc(c.x+16*c.s, c.y-6*c.s, 12*c.s, 0, 7);
    ctx.arc(c.x+32*c.s, c.y, 14*c.s, 0, 7); ctx.fill();
  }

  // ---------- Loop ----------
  let last=0;
  function loop(t){
    requestAnimationFrame(loop);
    const dt=Math.min((t-last)/16.7, 3); last=t; frame++;
    ctx.clearRect(0,0,W,H);

    // clouds
    clouds.forEach(c=>{ c.x-=0.4*dt; if(c.x<-50){c.x=W+40; c.y=20+Math.random()*70;} drawCloud(c); });

    // ground
    ctx.strokeStyle='#2c3e50'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(0,GROUND+2); ctx.lineTo(W,GROUND+2); ctx.stroke();
    ctx.strokeStyle='#1c2740'; ctx.setLineDash([8,10]);
    ctx.beginPath(); ctx.moveTo(0,GROUND+14); ctx.lineTo(W,GROUND+14); ctx.stroke();
    ctx.setLineDash([]);

    if(state==='play'){
      // physics
      dino.vy+=0.7*dt; dino.y+=dino.vy*dt;
      if(dino.y>=GROUND){ dino.y=GROUND; dino.vy=0; dino.air=false; }
      // score & speed
      score+=0.12*dt*speed/5;
      if(score>=nextMilestone){ sfx.point(); nextMilestone+=100; speed+=0.35; }
      // spawn
      spawnIn-=dt;
      if(spawnIn<=0){
        const n=1+Math.floor(Math.random()*2);
        obstacles.push({ x:W+10, w:16*n+8, h:34+Math.random()*22 });
        spawnIn=55+Math.random()*55 - speed*3;
      }
      // move + collide
      const leg=Math.floor(frame/8)%2;
      for(let i=obstacles.length-1;i>=0;i--){
        const o=obstacles[i]; o.x-=speed*dt;
        if(o.x+o.w<-10){ obstacles.splice(i,1); continue; }
        if(dino.x < o.x+o.w-4 && dino.x+dino.w > o.x+4 &&
           dino.y-dino.h < GROUND-4 && dino.y > GROUND-o.h+6){ gameOver(); }
      }
      document.getElementById('score').textContent=Math.floor(score);
      document.getElementById('speed').textContent=(speed/5).toFixed(1)+'x';
      drawDino(dino.x, dino.y, leg);
      obstacles.forEach(o=>drawCactus(o.x, GROUND, o.w, o.h));
    } else {
      drawDino(dino.x, dino.y, 0);
      obstacles.forEach(o=>drawCactus(o.x, GROUND, o.w, o.h));
      if(state==='ready'){
        ctx.fillStyle='#8a93a8'; ctx.font='14px sans-serif'; ctx.textAlign='center';
        ctx.fillText('Tap JUMP to start!', W/2, H/2);
      }
    }
  }

  // ---------- Input ----------
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const jumpBtn = document.getElementById('jumpBtn');

  // Some embedded WhatsApp WebViews are unreliable with pointerdown. Bind
  // click + pointerup + touchend + mouseup and debounce duplicate activations.
  bindTap(startBtn, start);
  bindTap(againBtn, ()=>{ reset(); state='play'; document.getElementById('start').classList.add('hidden'); });
  bindTap(jumpBtn, jump);
  bindTap(canvas, jump);

  document.addEventListener('keydown', e=>{
    if(e.code==='Space' || e.key==='ArrowUp'){ e.preventDefault(); jump(); }
  });

  // Watchdog fallback: when a rich HTML client renders the game but drops the
  // first control event, automatically leave READY after a short delay.
  setTimeout(()=>{ if(state==='ready') start(); },2500);

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
